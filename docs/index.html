<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>影视仓 · 下载</title>
<style>
  :root{--bg:#0c0d11;--card:#16181f;--txt:#e8e9ee;--sub:#8b8f9a;--accent:#ff6b3d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
  .wrap{max-width:520px;width:100%}
  .hero{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .hero img{width:58px;height:58px;border-radius:15px;box-shadow:0 8px 24px rgba(255,107,61,.22)}
  h1{font-size:28px;margin:0 0 6px}
  .hero h1{margin:0}
  .sub{color:var(--sub);margin:0 0 24px;font-size:14px}
  .hero .sub{margin:3px 0 0}
  .card{background:var(--card);border-radius:16px;padding:20px;margin-bottom:16px}
  .btn{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;
       padding:14px;border-radius:12px;font-weight:600;margin-bottom:12px}
  .btn.ghost{background:transparent;border:1px solid #2a2d38;color:var(--sub);font-weight:400;font-size:14px;padding:10px}
  ol{margin:0;padding-left:20px;color:var(--sub);font-size:14px}
  li{margin:6px 0}
  .qr{text-align:center}
  .qr img{width:180px;height:180px;background:#fff;padding:8px;border-radius:12px}
  .meta{color:var(--sub);font-size:12px;text-align:center;margin-top:20px}
  code{background:#0c0d11;padding:2px 6px;border-radius:6px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <img src="icon.png" alt="影视仓图标">
    <div>
      <h1>影视仓</h1>
      <p class="sub">影视聚合播放器 · Android｜<span id="ver">最新版</span></p>
    </div>
  </div>
  <p class="sub">App 名：影视仓｜Web 端叫放映厅</p>

  <div class="card">
    <a class="btn" id="dl" href="https://github.com/lxl-65/yingyin/releases/latest">下载最新版 APK</a>
    <a class="btn ghost" href="https://github.com/lxl-65/yingyin/releases">查看所有版本</a>
    <ol>
      <li>点上面的按钮下载 APK（微信里打不开，请用浏览器打开本页）</li>
      <li>安装时选择「允许安装未知来源应用」</li>
      <li>打开即用，源会自动更新，不用手动配置</li>
      <li>已装旧版可直接覆盖安装，收藏和观看记录会保留</li>
      <li>第一次从旧版升级需手动装一次；从 0.3.3 起，App 启动会自动提示后续更新</li>
    </ol>
  </div>

  <div class="card qr">
    <img src="qr.png" alt="扫码下载">
    <div class="sub" style="margin:10px 0 0">手机扫码打开本页</div>
  </div>

  <p class="meta">本应用仅聚合公开接口，不存储、不传播任何影视内容。<br>订阅源：<code>/sub.json</code> · 版本信息：<code>/version.json</code></p>
</div>
<script>
fetch('version.json', {cache: 'no-store'})
  .then(function (r) { return r.json() })
  .then(function (v) {
    var el = document.getElementById('ver')
    if (el && v.versionName) el.textContent = '最新版 ' + v.versionName
  })
  .catch(function () {})
</script>
</body>
</html>
